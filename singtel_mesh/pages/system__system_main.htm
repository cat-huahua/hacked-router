function decode_json(enc_str)
{

function get_sys_uptime(uptime)
{
var sec=parseInt(uptime);
if(isNaN(sec))
{
return"";}
var day=Math.floor(sec/(24*60*60));
sec=sec%(24*60*60);
var hour=Math.floor(sec/(60*60));
sec=sec%(60*60);
var min=Math.floor(sec/(60));
sec=sec%(60);
var strtime='';
if(day>1)
{
strtime+=day+" "+getLangM("420")+", ";}
else{
strtime+=day+" "+getLangM("419")+", ";}
if(hour>1)
{
strtime+=hour+" "+getLangM("422")+", ";}
else{
strtime+=hour+" "+getLangM("421")+", ";}
if(min>1)
{
strtime+=min+" "+getLangM("424");}
else{
strtime+=min+" "+getLangM("423");}
return strtime;}

else
